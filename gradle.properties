org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Le demon Kotlin communique en RMI sur la boucle locale, qui est instable sur
# ce poste (meme cause que "Unable to establish loopback connection" cote
# Gradle). En in-process le compilateur tourne dans le processus Gradle.
kotlin.compiler.execution.strategy=in-process
